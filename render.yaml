services:
  - type: web
    name: elos-api
    runtime: node
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && cd apps/elos-api && npx tsc
    startCommand: node apps/elos-api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
